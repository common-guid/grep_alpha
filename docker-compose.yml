services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: watchlist_monitor_app
    ports:
      - "3000:8000"
    volumes:
      - app_data:/app/data
      - ./grep_alpha/watchlists:/app/grep_alpha/watchlists
      - ./FlipCharts/watchlist.yaml:/app/FlipCharts/watchlist.yaml
      # Screens drop folder (Syncthing receive-only on the host), read-only in the container.
      # Set GA_SCREENS_HOST_DIR to the accepted Syncthing folder path; unset -> empty ./screens_drop.
      - ${GA_SCREENS_HOST_DIR:-./screens_drop}:/app/screens_drop:ro
    environment:
      - DATA_PROVIDER=yfinance
      - DB_PATH=/app/data/data.db
      - APCA_API_KEY_ID=${APCA_API_KEY_ID:-}
      - APCA_API_SECRET_KEY=${APCA_API_SECRET_KEY:-}
      - APCA_API_BASE_URL=${APCA_API_BASE_URL:-https://paper-api.alpaca.markets}
      # Alpaca PAPER account, read-only positions (GET /api/positions). Set in the host env or .env.
      - ALPACA_PAPER_KEY_ID=${ALPACA_PAPER_KEY_ID:-}
      - ALPACA_PAPER_SECRET_KEY=${ALPACA_PAPER_SECRET_KEY:-}
      - GA_SCREENS_DROP_DIR=/app/screens_drop
    restart: unless-stopped

volumes:
  app_data:
