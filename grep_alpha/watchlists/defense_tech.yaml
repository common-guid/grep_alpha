    thesis: "RTX benefits from the dual tailwinds of a historic commercial aerospace recovery (Collins/Pratt) and a record $190B+ backlog in defense. The Collins Aerospace segment provides superior margin expansion potential as widebody production rates normalize, while the Raytheon segment remains the primary beneficiary of global missile defense restocking."
    tags: defense, aero
  - symbol: LMT
    status: watching
    target_entry: null
    thesis: "Lockheed Martin maintains a dominant position as the prime contractor for the F-35, the world's largest defense program, ensuring multi-decade revenue visibility. The firm's pivot toward '21st Century Security'—integrating AI and JADC2 across platforms—and its massive backlog in HIMARS and PAC-3 systems position it for significant earnings growth in a high-threat geopolitical environment."
    tags: defense, aero, space
  - symbol: HWM
    status: watching
    target_entry: null
    thesis: "Howmet operates as a mission-critical bottleneck in the aerospace engine supply chain. As a near-monopolist in advanced turbine blades and specialized fasteners, HWM possesses immense pricing power. The shift toward next-gen engines (LEAP/GTF) requires higher-value components per shipset, driving structural margin expansion that the market consistently underestimates."
    tags: aero, defense
